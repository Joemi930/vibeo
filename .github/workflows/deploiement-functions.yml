# Déploiement des Edge Functions sur Supabase, depuis l'onglet Actions.
#
# Pourquoi ce workflow existe : le code des Edge Functions vit dans ce dépôt,
# mais corriger une fonction ici ne change rien tant qu'elle n'est pas
# redéployée. Sans ce workflow il faut une CLI Supabase installée et connectée
# au bon compte, ce qui n'est pas toujours possible.
#
# Déclenchement manuel uniquement : un déploiement touche la production, il ne
# doit pas partir tout seul sur une simple poussée.
#
# Prérequis, une seule fois : créer le secret SUPABASE_ACCESS_TOKEN dans
# Settings > Secrets and variables > Actions. Le jeton se génère sur
# https://supabase.com/dashboard/account/tokens
name: Déploiement des Edge Functions

on:
  workflow_dispatch:
    inputs:
      fonction:
        description: "Fonction à déployer"
        required: true
        default: admin-actions
        type: choice
        options:
          - admin-actions
          - verify-artist
          - moderate-video
          - purge-identity-docs
          - delete-account
          - toutes

permissions:
  contents: read

# Deux déploiements simultanés sur le même projet se marcheraient dessus.
concurrency:
  group: deploiement-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer sur Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Vérifier que le jeton est configuré
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Le secret SUPABASE_ACCESS_TOKEN est absent. Le créer dans Settings > Secrets and variables > Actions, à partir d'un jeton généré sur https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          echo "Jeton présent."

      - name: Déployer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # La référence du projet n'est pas un secret : elle figure déjà dans
          # l'URL de l'API que l'application web expose publiquement.
          PROJECT_REF: ilqvqohjoekthxouwffd
          # Passé par variable et non interpolé dans le script : une entrée de
          # workflow ne doit jamais être collée telle quelle dans un shell.
          FONCTION: ${{ inputs.fonction }}
        run: |
          set -euo pipefail
          # `supabase functions deploy` lit supabase/config.toml et respecte
          # donc le réglage verify_jwt propre à chaque fonction.
          if [ "$FONCTION" = "toutes" ]; then
            for f in admin-actions verify-artist moderate-video purge-identity-docs delete-account; do
              echo "::group::$f"
              supabase functions deploy "$f" --project-ref "$PROJECT_REF"
              echo "::endgroup::"
            done
          else
            supabase functions deploy "$FONCTION" --project-ref "$PROJECT_REF"
          fi
