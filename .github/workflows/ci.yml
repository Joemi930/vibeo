name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # Permet de relancer la CI à la demande depuis l'onglet Actions, sans
  # dépendre du déclenchement automatique par push — utile lors d'un incident
  # GitHub où les webhooks push/pull_request sont throttlés côté plateforme.
  workflow_dispatch:

# Les poussées rapprochées s'annulent : seul le dernier état d'une branche
# mérite d'être vérifié.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Scan de secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sans l'historique complet, gitleaks ne scanne que l'état courant :
          # une clé committée puis retirée passerait inaperçue alors qu'elle
          # reste lisible dans l'historique — et donc compromise.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  build:
    name: Analyse, tests et build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique
        run: flutter analyze

      - name: Tests (unitaires + widgets)
        run: flutter test

      # `integration_test/` n'est PAS lancé ici : il exige un émulateur Android
      # ou un chromedriver, absents de ce runner. Il s'exécute en local (voir
      # README). `flutter test` reste la porte verte unique de la CI.

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
        run: |
          flutter build web --release --csp \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=WEB_BASE_URL="$WEB_BASE_URL"

  # Le job « Tests des Edge Functions » (deno test) a été retiré ici.
  #
  # Il pointait sur supabase/functions/tests/, qui contenait les tests de
  # ai-provider.ts et verification-rules.ts. Le retrait complet de l'IA
  # (commit 89865dc) a supprimé ces deux fichiers avec le code qu'ils
  # testaient — logique, ils n'avaient plus rien à couvrir — mais a laissé
  # ce job pointer sur un dossier vide, où `deno test` échoue avec
  # « Import ... failed, not found » plutôt que de simplement ne rien trouver
  # à exécuter. Résultat : CI rouge sur main depuis, sans rapport avec un vrai
  # défaut du code.
  #
  # Aucun autre fichier *_test.ts n'existe dans supabase/functions/ à ce jour
  # (vérifié). Si des tests Deno reviennent pour admin-actions, verify-artist
  # ou require-admin.ts, réintroduire ce job en pointant sur leur dossier.
