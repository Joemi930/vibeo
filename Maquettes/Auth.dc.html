<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; -webkit-font-feature-settings: 'liga'; }
</style>
</helmet>

<div style="width:390px;height:844px;background:var(--bg,#121016);color:var(--tx,#F4F1F8);font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:0 26px;">

  <div style="height:44px;flex:none;"></div>

  <!-- logo -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:44px;margin-bottom:38px;">
    <svg width="58" height="58" viewBox="0 0 100 100"><g fill="var(--pri2,#8B5CF6)"><rect x="8" y="18" width="12" height="66" rx="6"/><rect x="27" y="40" width="12" height="44" rx="6"/><rect x="46" y="58" width="12" height="26" rx="6" fill="var(--acc,#B69DF8)"/><rect x="65" y="40" width="12" height="44" rx="6"/><rect x="84" y="18" width="12" height="66" rx="6"/></g></svg>
    <div style="text-align:center;"><div style="font-size:24px;font-weight:800;letter-spacing:-0.02em;">Bienvenue sur Vibeo</div><div style="font-size:14px;color:var(--tx3,#7C7589);margin-top:6px;">Les clips de tes artistes préférés, vérifiés.</div></div>
  </div>

  <!-- segmented toggle -->
  <div style="background:var(--s2,#241F2B);border-radius:999px;padding:4px;display:flex;margin-bottom:24px;">
    <div style="flex:1;text-align:center;background:linear-gradient(135deg,#7C3AED,#4F46E5);color:#fff;font-size:14px;font-weight:600;padding:10px;border-radius:999px;">Connexion</div>
    <div style="flex:1;text-align:center;color:var(--tx2,#B9B2C7);font-size:14px;font-weight:600;padding:10px;">Inscription</div>
  </div>

  <!-- fields -->
  <div style="position:relative;border:1px solid var(--out,#4A3E6E);border-radius:12px;padding:19px 14px 8px;margin-bottom:16px;"><span style="position:absolute;top:-8px;left:12px;background:var(--bg,#121016);padding:0 6px;font-size:12px;color:var(--acc,#B69DF8);">Email</span><span style="font-size:15px;">naika@vibeo.app</span></div>
  <div style="position:relative;border:1px solid var(--out,#4A3E6E);border-radius:12px;padding:19px 14px 8px;margin-bottom:10px;"><span style="position:absolute;top:-8px;left:12px;background:var(--bg,#121016);padding:0 6px;font-size:12px;color:var(--acc,#B69DF8);">Mot de passe</span><span style="font-size:15px;">••••••••</span><span class="ms" style="position:absolute;right:14px;top:18px;font-size:20px;color:var(--tx3,#7C7589);">visibility</span></div>
  <div style="text-align:right;margin-bottom:22px;"><span style="font-size:13px;font-weight:600;color:var(--acc,#B69DF8);">Mot de passe oublié ?</span></div>

  <!-- primary -->
  <button style="width:100%;border:0;border-radius:999px;padding:15px;font:700 15px 'Plus Jakarta Sans';color:#fff;background:linear-gradient(135deg,#7C3AED,#4F46E5);margin-bottom:18px;">Se connecter</button>

  <!-- divider -->
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;"><div style="flex:1;height:1px;background:var(--out,#322C3D);"></div><span style="font-size:12px;color:var(--tx3,#7C7589);">ou</span><div style="flex:1;height:1px;background:var(--out,#322C3D);"></div></div>

  <!-- google -->
  <button style="width:100%;border:1px solid var(--out,#4A3E6E);border-radius:999px;padding:13px;font:600 14px 'Plus Jakarta Sans';color:var(--tx,#F4F1F8);background:var(--s1,#1B1820);display:flex;align-items:center;justify-content:center;gap:10px;">
    <span style="width:18px;height:18px;border-radius:50%;background:conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0);display:inline-block;"></span>
    Continuer avec Google
  </button>

  <div style="flex:1;"></div>
  <div style="text-align:center;font-size:11px;color:var(--tx3,#7C7589);padding-bottom:26px;line-height:1.5;">En continuant, tu acceptes nos<br>Conditions d'utilisation et notre Politique de confidentialité.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
