<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; -webkit-font-feature-settings: 'liga'; }
</style>
</helmet>

<div style="width:390px;height:844px;background:var(--bg,#121016);color:var(--tx,#F4F1F8);font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:44px;flex:none;"></div>
  <div style="padding:8px 16px 4px;flex:none;display:flex;align-items:center;justify-content:space-between;"><span style="font-size:24px;font-weight:800;letter-spacing:-0.02em;">Bibliothèque</span><span class="ms" style="font-size:26px;color:var(--acc,#B69DF8);">add</span></div>
  <div style="display:flex;gap:22px;padding:14px 16px 0;flex:none;border-bottom:1px solid var(--out,#322C3D);">
    <div style="padding-bottom:10px;border-bottom:2px solid var(--pri2,#8B5CF6);font-size:14px;font-weight:700;">Playlists</div>
    <div style="padding-bottom:10px;color:var(--tx3,#7C7589);font-size:14px;font-weight:600;">Abonnements</div>
    <div style="padding-bottom:10px;color:var(--tx3,#7C7589);font-size:14px;font-weight:600;">Historique</div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;text-align:center;">
    <div style="width:104px;height:104px;border-radius:26px;background:var(--pc,#35216B);display:flex;align-items:center;justify-content:center;margin-bottom:24px;"><span class="ms" style="font-size:52px;color:var(--onpc,#E9DDFF);">playlist_add</span></div>
    <div style="font-size:19px;font-weight:700;margin-bottom:8px;">Aucune playlist pour l'instant</div>
    <div style="font-size:14px;line-height:1.5;color:var(--tx3,#7C7589);">Regroupe tes clips préférés et retrouve-les d'un geste, même en mode audio.</div>
    <button style="margin-top:24px;border:0;border-radius:999px;padding:14px 26px;font:700 15px 'Plus Jakarta Sans';color:#fff;background:linear-gradient(135deg,#7C3AED,#4F46E5);display:flex;align-items:center;gap:8px;"><span class="ms" style="font-size:20px;">add</span>Crée ta première playlist</button>
  </div>

  <div style="flex:none;background:var(--s1,#1B1820);border-top:1px solid var(--out,#322C3D);padding:8px 8px 14px;display:flex;justify-content:space-around;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3,#7C7589);"><span class="ms" style="font-size:24px;">home</span><span style="font-size:11px;">Accueil</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3,#7C7589);"><span class="ms" style="font-size:24px;">search</span><span style="font-size:11px;">Recherche</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--acc,#B69DF8);"><span class="ms" style="font-size:24px;font-variation-settings:'FILL' 1;">video_library</span><span style="font-size:11px;font-weight:600;">Bibliothèque</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3,#7C7589);"><span class="ms" style="font-size:24px;">person</span><span style="font-size:11px;">Profil</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
