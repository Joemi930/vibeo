<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; -webkit-font-feature-settings: 'liga'; }
</style>
</helmet>

<div style="width:390px;height:844px;background:var(--bg,#121016);color:var(--tx,#F4F1F8);font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:44px;flex:none;"></div>
  <div style="padding:8px 16px 0;flex:none;display:flex;align-items:center;gap:14px;"><span class="ms" style="font-size:26px;">arrow_back</span><span style="font-size:20px;font-weight:800;">Paramètres</span></div>

  <div style="flex:1;overflow:hidden;padding:18px 16px 0;">
    <!-- theme -->
    <div style="font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--tx3,#7C7589);margin-bottom:12px;">Apparence</div>
    <div style="display:flex;gap:10px;margin-bottom:26px;">
      <div style="flex:1;text-align:center;"><div style="border-radius:12px;overflow:hidden;border:2px solid var(--pri2,#8B5CF6);background:#121016;height:70px;position:relative;"><div style="position:absolute;top:8px;left:8px;right:24px;height:6px;border-radius:3px;background:#2E2836;"></div><div style="position:absolute;top:20px;left:8px;width:26px;height:26px;border-radius:6px;background:#7C3AED;"></div></div><div style="font-size:12px;font-weight:700;margin-top:8px;color:var(--pri2,#8B5CF6);">Sombre</div></div>
      <div style="flex:1;text-align:center;"><div style="border-radius:12px;overflow:hidden;border:1px solid var(--out,#322C3D);background:#FAF9FC;height:70px;position:relative;"><div style="position:absolute;top:8px;left:8px;right:24px;height:6px;border-radius:3px;background:#E9E4F3;"></div><div style="position:absolute;top:20px;left:8px;width:26px;height:26px;border-radius:6px;background:#6C3BD9;"></div></div><div style="font-size:12px;font-weight:600;margin-top:8px;color:var(--tx3,#7C7589);">Clair</div></div>
      <div style="flex:1;text-align:center;"><div style="border-radius:12px;overflow:hidden;border:1px solid var(--out,#322C3D);height:70px;position:relative;background:linear-gradient(90deg,#121016 50%,#FAF9FC 50%);"><div style="position:absolute;top:20px;left:8px;width:26px;height:26px;border-radius:6px;background:#7C3AED;"></div></div><div style="font-size:12px;font-weight:600;margin-top:8px;color:var(--tx3,#7C7589);">Système</div></div>
    </div>

    <!-- account -->
    <div style="font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--tx3,#7C7589);margin-bottom:12px;">Compte</div>
    <div style="background:var(--s1,#1B1820);border:1px solid var(--out,#322C3D);border-radius:12px;overflow:hidden;margin-bottom:26px;">
      <div style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--out,#322C3D);"><span class="ms" style="font-size:22px;color:var(--acc,#B69DF8);">person</span><span style="flex:1;font-size:14px;font-weight:600;">Infos du profil</span><span class="ms" style="font-size:20px;color:var(--tx3,#7C7589);">chevron_right</span></div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--out,#322C3D);"><span class="ms" style="font-size:22px;color:var(--acc,#B69DF8);">notifications</span><span style="flex:1;font-size:14px;font-weight:600;">Notifications</span><span class="ms" style="font-size:20px;color:var(--tx3,#7C7589);">chevron_right</span></div>
      <div style="display:flex;align-items:center;gap:12px;padding:14px;"><span class="ms" style="font-size:22px;color:var(--acc,#B69DF8);">lock</span><span style="flex:1;font-size:14px;font-weight:600;">Confidentialité</span><span class="ms" style="font-size:20px;color:var(--tx3,#7C7589);">chevron_right</span></div>
    </div>

    <!-- logout -->
    <button style="width:100%;border:1px solid var(--out,#4A3E6E);background:var(--s1,#1B1820);color:var(--tx,#F4F1F8);border-radius:12px;padding:14px;font:600 14px 'Plus Jakarta Sans';display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:26px;"><span class="ms" style="font-size:20px;">logout</span>Se déconnecter</button>

    <!-- danger zone -->
    <div style="font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--err,#FF6B6B);margin-bottom:12px;">Zone de danger</div>
    <div style="border:1px solid var(--err,#FF6B6B);border-radius:12px;padding:16px;background:var(--errb,#3A1D22);">
      <div style="font-size:14px;font-weight:700;color:var(--err,#FF6B6B);margin-bottom:4px;">Supprimer mon compte</div>
      <div style="font-size:12.5px;line-height:1.5;color:var(--err,#FF6B6B);opacity:.9;margin-bottom:14px;">Action définitive : tes clips, playlists et abonnés seront supprimés.</div>
      <button style="border:1px solid var(--err,#FF6B6B);background:transparent;color:var(--err,#FF6B6B);border-radius:999px;padding:10px 20px;font:700 13px 'Plus Jakarta Sans';">Supprimer le compte</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
