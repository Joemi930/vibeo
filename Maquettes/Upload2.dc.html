<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; -webkit-font-feature-settings: 'liga'; }
</style>
</helmet>

<div style="width:390px;height:844px;background:var(--bg,#121016);color:var(--tx,#F4F1F8);font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:44px;flex:none;"></div>
  <div style="padding:8px 16px 0;flex:none;display:flex;align-items:center;gap:14px;"><span class="ms" style="font-size:26px;">arrow_back</span><span style="font-size:18px;font-weight:700;">Nouveau clip</span></div>
  <div style="display:flex;align-items:center;gap:6px;padding:18px 16px 0;flex:none;">
    <div style="flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,#7C3AED,#4F46E5);"></div>
    <div style="flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,#7C3AED,#4F46E5);"></div>
    <div style="flex:1;height:4px;border-radius:4px;background:var(--out,#322C3D);"></div>
    <div style="flex:1;height:4px;border-radius:4px;background:var(--out,#322C3D);"></div>
  </div>
  <div style="padding:8px 16px 0;flex:none;font-size:12px;color:var(--tx3,#7C7589);font-weight:600;">Étape 2/4 · Compression</div>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 30px;">
    <!-- ring -->
    <div style="position:relative;width:180px;height:180px;margin-bottom:30px;">
      <svg width="180" height="180" viewBox="0 0 180 180" style="transform:rotate(-90deg);">
        <circle cx="90" cy="90" r="78" fill="none" stroke="var(--s3,#2E2836)" stroke-width="12"/>
        <circle cx="90" cy="90" r="78" fill="none" stroke="url(#ug)" stroke-width="12" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="186"/>
        <defs><linearGradient id="ug" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#4F46E5"/></linearGradient></defs>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;"><span style="font-size:40px;font-weight:800;letter-spacing:-0.02em;">62%</span><span style="font-size:12px;color:var(--tx3,#7C7589);margin-top:2px;">Compression…</span></div>
    </div>

    <div style="font-size:17px;font-weight:700;margin-bottom:4px;">Optimisation en cours</div>
    <div style="font-size:13px;color:var(--tx3,#7C7589);text-align:center;line-height:1.5;margin-bottom:26px;">On réduit le poids sans perte visible. Ça prend quelques secondes.</div>

    <!-- size before/after -->
    <div style="width:100%;background:var(--s1,#1B1820);border:1px solid var(--out,#322C3D);border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:space-between;">
      <div style="text-align:center;flex:1;"><div style="font-size:12px;color:var(--tx3,#7C7589);">Avant</div><div style="font-size:20px;font-weight:800;margin-top:3px;">1,8 Go</div></div>
      <span class="ms" style="font-size:26px;color:var(--acc,#B69DF8);">arrow_forward</span>
      <div style="text-align:center;flex:1;"><div style="font-size:12px;color:var(--ok,#4ADE80);">Après (est.)</div><div style="font-size:20px;font-weight:800;margin-top:3px;color:var(--ok,#4ADE80);">412 Mo</div></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
