<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; -webkit-font-feature-settings: 'liga'; }
</style>
</helmet>

<div style="width:390px;height:844px;background:var(--bg,#121016);color:var(--tx,#F4F1F8);font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden;">

  <!-- banner -->
  <div style="position:relative;height:150px;flex:none;background:var(--stripe,#241F2B);">
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,#00000055,#0000 40%,var(--bg,#121016));"></div>
    <div style="position:absolute;top:44px;left:14px;color:#fff;"><span class="ms" style="font-size:26px;">arrow_back</span></div>
    <div style="position:absolute;top:44px;right:14px;color:#fff;"><span class="ms" style="font-size:24px;">more_vert</span></div>
    <div style="position:absolute;left:20px;bottom:-34px;width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#4F46E5);border:4px solid var(--bg,#121016);"></div>
  </div>

  <!-- identity -->
  <div style="padding:44px 20px 0;flex:none;">
    <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:23px;font-weight:800;letter-spacing:-0.01em;">Naïka</span><span class="ms" style="font-size:20px;color:var(--pri2,#8B5CF6);font-variation-settings:'FILL' 1;">verified</span></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:6px;font-size:13px;color:var(--tx3,#7C7589);"><span><strong style="color:var(--tx,#F4F1F8);">412 k</strong> abonnés</span><span><strong style="color:var(--tx,#F4F1F8);">38</strong> clips</span></div>
    <div style="font-size:13px;line-height:1.5;color:var(--tx2,#B9B2C7);margin-top:12px;">Chanteuse afro-pop entre Dakar et Paris. Nouveau projet « Ciel ouvert » disponible partout.</div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button style="flex:1;border:0;border-radius:999px;padding:13px;font:600 14px 'Plus Jakarta Sans';color:#fff;background:linear-gradient(135deg,#7C3AED,#4F46E5);display:flex;align-items:center;justify-content:center;gap:7px;"><span class="ms" style="font-size:19px;">add</span>S'abonner</button>
      <button style="flex:none;width:48px;border:1px solid var(--out,#322C3D);background:var(--s2,#241F2B);border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--tx,#F4F1F8);"><span class="ms" style="font-size:20px;">notifications</span></button>
    </div>
  </div>

  <!-- tabs -->
  <div style="display:flex;gap:24px;padding:20px 20px 0;flex:none;border-bottom:1px solid var(--out,#322C3D);">
    <div style="padding-bottom:10px;border-bottom:2px solid var(--pri2,#8B5CF6);color:var(--tx,#F4F1F8);font-size:14px;font-weight:700;">Clips</div>
    <div style="padding-bottom:10px;color:var(--tx3,#7C7589);font-size:14px;font-weight:600;">Playlists</div>
    <div style="padding-bottom:10px;color:var(--tx3,#7C7589);font-size:14px;font-weight:600;">À propos</div>
  </div>

  <!-- grid -->
  <div style="flex:1;overflow:hidden;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;">
    <div>
      <div style="position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--stripe,#241F2B);"><span style="position:absolute;right:6px;bottom:6px;background:#000000cc;color:#fff;font-size:10px;font-weight:600;padding:2px 5px;border-radius:4px;">3:42</span></div>
      <div style="font-size:13px;font-weight:600;line-height:1.3;margin-top:8px;">Ciel ouvert</div>
      <div style="font-size:11px;color:var(--tx3,#7C7589);margin-top:2px;">834 k vues</div>
    </div>
    <div>
      <div style="position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--stripe,#241F2B);"><span style="position:absolute;right:6px;bottom:6px;background:#000000cc;color:#fff;font-size:10px;font-weight:600;padding:2px 5px;border-radius:4px;">4:15</span></div>
      <div style="font-size:13px;font-weight:600;line-height:1.3;margin-top:8px;">Nuit blanche</div>
      <div style="font-size:11px;color:var(--tx3,#7C7589);margin-top:2px;">1,2 M vues</div>
    </div>
    <div>
      <div style="position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--stripe,#241F2B);"><span style="position:absolute;right:6px;bottom:6px;background:#000000cc;color:#fff;font-size:10px;font-weight:600;padding:2px 5px;border-radius:4px;">2:58</span></div>
      <div style="font-size:13px;font-weight:600;line-height:1.3;margin-top:8px;">Loin d'ici</div>
      <div style="font-size:11px;color:var(--tx3,#7C7589);margin-top:2px;">512 k vues</div>
    </div>
    <div>
      <div style="position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--stripe,#241F2B);"><span style="position:absolute;right:6px;bottom:6px;background:#000000cc;color:#fff;font-size:10px;font-weight:600;padding:2px 5px;border-radius:4px;">5:03</span></div>
      <div style="font-size:13px;font-weight:600;line-height:1.3;margin-top:8px;">Session live</div>
      <div style="font-size:11px;color:var(--tx3,#7C7589);margin-top:2px;">276 k vues</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
