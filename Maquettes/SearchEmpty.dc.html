<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; -webkit-font-feature-settings: 'liga'; }
</style>
</helmet>

<div style="width:390px;height:844px;background:var(--bg,#121016);color:var(--tx,#F4F1F8);font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:44px;flex:none;"></div>
  <div style="padding:8px 16px 12px;flex:none;">
    <div style="background:var(--s2,#241F2B);border-radius:999px;padding:12px 16px;display:flex;align-items:center;gap:10px;border:1px solid var(--out,#322C3D);">
      <span class="ms" style="font-size:22px;color:var(--acc,#B69DF8);">search</span>
      <span style="flex:1;font-size:15px;">zxqwrt</span>
      <span class="ms" style="font-size:20px;color:var(--tx3,#7C7589);">close</span>
    </div>
  </div>

  <!-- empty state -->
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px;text-align:center;">
    <div style="width:104px;height:104px;border-radius:50%;background:var(--s2,#241F2B);display:flex;align-items:center;justify-content:center;margin-bottom:24px;position:relative;">
      <span class="ms" style="font-size:52px;color:var(--tx3,#7C7589);">search_off</span>
      <div style="position:absolute;bottom:6px;right:8px;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#4F46E5);display:flex;align-items:center;justify-content:center;"><span class="ms" style="font-size:18px;color:#fff;">question_mark</span></div>
    </div>
    <div style="font-size:19px;font-weight:700;margin-bottom:8px;">Aucun résultat pour « zxqwrt »</div>
    <div style="font-size:14px;line-height:1.5;color:var(--tx3,#7C7589);">Vérifie l'orthographe ou essaie un autre nom d'artiste, de clip ou de genre.</div>
    <button style="margin-top:24px;border:1px solid var(--out,#4A3E6E);background:var(--s1,#1B1820);color:var(--acc,#B69DF8);border-radius:999px;padding:11px 22px;font:600 14px 'Plus Jakarta Sans';">Effacer la recherche</button>
  </div>

  <div style="flex:none;background:var(--s1,#1B1820);border-top:1px solid var(--out,#322C3D);padding:8px 8px 14px;display:flex;justify-content:space-around;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3,#7C7589);"><span class="ms" style="font-size:24px;">home</span><span style="font-size:11px;">Accueil</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--acc,#B69DF8);"><span class="ms" style="font-size:24px;font-variation-settings:'FILL' 1;">search</span><span style="font-size:11px;font-weight:600;">Recherche</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3,#7C7589);"><span class="ms" style="font-size:24px;">video_library</span><span style="font-size:11px;">Bibliothèque</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3,#7C7589);"><span class="ms" style="font-size:24px;">person</span><span style="font-size:11px;">Profil</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
