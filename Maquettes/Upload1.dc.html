<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; -webkit-font-feature-settings: 'liga'; }
</style>
</helmet>

<div style="width:390px;height:844px;background:var(--bg,#121016);color:var(--tx,#F4F1F8);font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden;">
  <div style="height:44px;flex:none;"></div>
  <div style="padding:8px 16px 0;flex:none;display:flex;align-items:center;gap:14px;"><span class="ms" style="font-size:26px;">close</span><span style="font-size:18px;font-weight:700;">Nouveau clip</span></div>

  <!-- steps indicator -->
  <div style="display:flex;align-items:center;gap:6px;padding:18px 16px 0;flex:none;">
    <div style="flex:1;height:4px;border-radius:4px;background:linear-gradient(90deg,#7C3AED,#4F46E5);"></div>
    <div style="flex:1;height:4px;border-radius:4px;background:var(--out,#322C3D);"></div>
    <div style="flex:1;height:4px;border-radius:4px;background:var(--out,#322C3D);"></div>
    <div style="flex:1;height:4px;border-radius:4px;background:var(--out,#322C3D);"></div>
  </div>
  <div style="padding:8px 16px 0;flex:none;font-size:12px;color:var(--tx3,#7C7589);font-weight:600;">Étape 1/4 · Sélection</div>

  <div style="flex:1;overflow:hidden;padding:20px 16px 0;">
    <!-- dropzone -->
    <div style="border:2px dashed var(--out,#4A3E6E);border-radius:16px;padding:38px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--s1,#1B1820);margin-bottom:22px;">
      <div style="width:66px;height:66px;border-radius:50%;background:var(--pc,#35216B);display:flex;align-items:center;justify-content:center;margin-bottom:16px;"><span class="ms" style="font-size:34px;color:var(--onpc,#E9DDFF);">video_call</span></div>
      <div style="font-size:16px;font-weight:700;margin-bottom:6px;">Choisis une vidéo</div>
      <div style="font-size:13px;color:var(--tx3,#7C7589);line-height:1.5;">MP4 ou MOV · jusqu'à 4 Go · 16:9 recommandé</div>
      <button style="margin-top:18px;border:0;border-radius:999px;padding:12px 24px;font:700 14px 'Plus Jakarta Sans';color:#fff;background:linear-gradient(135deg,#7C3AED,#4F46E5);">Parcourir</button>
    </div>

    <div style="font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--tx3,#7C7589);margin-bottom:12px;">Récents</div>
    <div style="display:flex;gap:10px;">
      <div style="flex:1;position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--stripe,#241F2B);"><span style="position:absolute;right:5px;bottom:5px;background:#000000cc;color:#fff;font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;">3:12</span></div>
      <div style="flex:1;position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--stripe,#241F2B);"><span style="position:absolute;right:5px;bottom:5px;background:#000000cc;color:#fff;font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;">0:48</span></div>
      <div style="flex:1;position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--stripe,#241F2B);"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
