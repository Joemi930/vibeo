<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; line-height: 1; -webkit-font-feature-settings: 'liga'; }
</style>
</helmet>

<div style="width:390px;height:844px;background:var(--bg,#121016);color:var(--tx,#F4F1F8);font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;overflow:hidden;">

  <!-- header -->
  <div style="height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0;">
    <span class="ms" style="font-size:28px;">expand_more</span>
    <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--tx3,#7C7589);">Lecture audio</span>
    <span class="ms" style="font-size:24px;">more_horiz</span>
  </div>

  <!-- artwork -->
  <div style="padding:26px 34px 0;">
    <div style="width:100%;aspect-ratio:1;border-radius:20px;background:var(--stripe,#241F2B);box-shadow:0 20px 50px #0006;"></div>
  </div>

  <!-- title -->
  <div style="padding:26px 30px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
    <div style="min-width:0;">
      <div style="display:flex;align-items:center;gap:5px;"><span style="font-size:22px;font-weight:700;letter-spacing:-0.01em;">Sous les néons</span></div>
      <div style="display:flex;align-items:center;gap:5px;margin-top:4px;"><span style="font-size:14px;color:var(--tx2,#B9B2C7);">Djino</span><span class="ms" style="font-size:15px;color:var(--pri2,#8B5CF6);font-variation-settings:'FILL' 1;">verified</span></div>
    </div>
    <span class="ms" style="font-size:28px;color:var(--acc,#B69DF8);font-variation-settings:'FILL' 1;">favorite</span>
  </div>

  <!-- progress -->
  <div style="padding:24px 30px 0;">
    <div style="height:4px;background:var(--out,#322C3D);border-radius:4px;overflow:hidden;position:relative;"><div style="width:36%;height:100%;background:linear-gradient(90deg,#7C3AED,#4F46E5);"></div><div style="position:absolute;left:36%;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:var(--tx,#F4F1F8);"></div></div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--tx3,#7C7589);"><span>1:24</span><span>3:58</span></div>
  </div>

  <!-- controls -->
  <div style="padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;">
    <span class="ms" style="font-size:30px;">skip_previous</span>
    <span class="ms" style="font-size:32px;color:var(--tx2,#B9B2C7);">replay_10</span>
    <div style="width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#4F46E5);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px #7c3aed55;"><span class="ms" style="font-size:38px;color:#fff;font-variation-settings:'FILL' 1;">pause</span></div>
    <span class="ms" style="font-size:32px;color:var(--tx2,#B9B2C7);">forward_10</span>
    <span class="ms" style="font-size:30px;">skip_next</span>
  </div>

  <!-- back to video -->
  <div style="padding:26px 30px 0;">
    <button style="width:100%;border:1px solid var(--out,#4A3E6E);background:var(--pc,#35216B);color:var(--onpc,#E9DDFF);border-radius:999px;padding:13px;font:600 14px 'Plus Jakarta Sans';display:flex;align-items:center;justify-content:center;gap:8px;"><span class="ms" style="font-size:20px;">smart_display</span>Revenir à la vidéo</button>
  </div>

  <!-- queue -->
  <div style="flex:1;overflow:hidden;padding:24px 20px 0;">
    <div style="font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--tx3,#7C7589);margin-bottom:12px;">À suivre</div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;"><div style="width:44px;height:44px;border-radius:8px;background:var(--stripe,#241F2B);flex:none;"></div><div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:600;">Loin d'ici</div><div style="font-size:12px;color:var(--tx3,#7C7589);">Djino</div></div><span class="ms" style="font-size:22px;color:var(--tx3,#7C7589);">drag_indicator</span></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;"><div style="width:44px;height:44px;border-radius:8px;background:var(--stripe,#241F2B);flex:none;"></div><div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:600;">Gospel Sunrise</div><div style="font-size:12px;color:var(--tx3,#7C7589);">Ayo Mensah</div></div><span class="ms" style="font-size:22px;color:var(--tx3,#7C7589);">drag_indicator</span></div>
    <div style="display:flex;align-items:center;gap:12px;"><div style="width:44px;height:44px;border-radius:8px;background:var(--stripe,#241F2B);flex:none;"></div><div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:600;">Nuit blanche</div><div style="font-size:12px;color:var(--tx3,#7C7589);">Naïka</div></div><span class="ms" style="font-size:22px;color:var(--tx3,#7C7589);">drag_indicator</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}"></script>
</body>
</html>
